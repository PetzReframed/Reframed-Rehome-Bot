name: Build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # A draft runs nothing; marking it ready for review starts the checks.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  LOCAL_IMAGE: reframed-rehome-bot:ci
jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests with the runner's Python
        run: python3 -m unittest discover -s tests -t .
      - name: Build the image
        run: docker build -t "$LOCAL_IMAGE" .
      - name: Unit tests with the image's Python
        run: docker run --rm --network none -v "$PWD/tests:/app/tests:ro" "$LOCAL_IMAGE" python -m unittest discover -s tests -t .
      - name: The image refuses to start without its settings
        run: |
          status=0
          docker run --rm --network none --read-only "$LOCAL_IMAGE" || status=$?
          test "$status" -eq 2

  publish:
    # Only a trusted run of the default branch or a version tag writes to the registry; pull requests never do.
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=("${GITHUB_REF_NAME}" latest)
          else
            tags=("${GITHUB_REF_NAME}")
          fi
          docker build -t "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            docker tag "$LOCAL_IMAGE" "$image:$tag"
            docker push "$image:$tag"
          done
          docker logout ghcr.io
